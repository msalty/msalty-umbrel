manifestVersion: 1
id: msalty-rioserver
name: RioServer NG
tagline: Music and network-boot server for Rio and Dell Digital Audio Receivers
icon: https://raw.githubusercontent.com/msalty/msalty-umbrel/main/msalty-rioserver/icon.svg
category: media
version: "0.2.5"
port: 12078
description: >-
  A modern replacement for the server software of the Rio Receiver and the
  Dell Digital Audio Receiver. These 2001-era network MP3 players have no music
  and almost no software of their own: every time they power on they download
  their operating system from a server on the network and then stream music
  from it.


  Features:
    - iPod-style menus on the receiver: Music › Artists › Albums › Songs, with albums in release order and tracks in album order, plus Genres, Playlists (with Top 25 Most Played and Recently Played), Podcasts, Recently Added, Shuffle and Now Playing.
    - A web interface for browsing your library with album and artist art, search, an A-Z bar and album sorting. Play music in the browser or send it to any receiver or speaker and control it from there, with a full-screen Now Playing, a Light / Dark / System theme and colours from the album art.
    - Up Next: see and reorder what's coming up on any player, use "Play next" or "Add to Up Next", and move playback from one room to another.
    - Chromecast: Chromecasts, Google Home and Nest speakers, speaker groups and TVs with Chromecast built-in show up next to your receivers, and play without gaps between tracks.
    - Phones and tablets as receivers: turn an old phone or tablet plugged into a stereo into a receiver from its browser.
    - AirPlay and Spotify Connect: each receiver, and each phone or tablet used as a receiver, can show up as a speaker in an iPhone's AirPlay menu and in Spotify's device picker. Chromecasts and Google speakers can be AirPlay speakers too, and speaker groups play AirPlay in sync. Switch it on per receiver or speaker.
    - Playlists you make in the web interface, which show up on the receivers too, plus play history.
    - Podcasts: subscribe by feed URL or OPML. Episodes download to your Umbrel and resume where you left off on any device.
    - Name your receivers ("Kitchen"), set a sleep timer that fades out, or an alarm that starts music and fades it in.
    - RioAmp: turn the web interface into a classic late-1990s skinned desktop player, classic .wsz skins included, with a ten-band equaliser and balance that work on every player.
    - Automatic library updates: music you add, change or remove shows up within seconds.
    - Network boot: the receivers boot straight from your Umbrel. You don't need a Windows PC or a separate NFS server.
    - Works with the original SonicBlue/Dell firmware too.


  Put your MP3s in Files › Downloads › music (the same folder Navidrome uses),
  then power-cycle your receivers. They must be on the same network and subnet
  as your Umbrel.


  RioServer NG uses host networking because the receivers find the server with
  UDP broadcasts and boot over NFS, and Chromecasts, AirPlay and Spotify
  Connect use mDNS. It needs these ports to be free on your Umbrel: 12078/tcp,
  21075/udp, 111, 627 and 2049 (tcp and udp). For receivers and speakers you
  switch AirPlay or Spotify Connect on for, it also uses 6200-6327 (AirPlay,
  tcp and udp) and 6400-6415/tcp (Spotify Connect). If your Umbrel already runs an NFS server or
  rpcbind, the receivers might not be able to network-boot.
