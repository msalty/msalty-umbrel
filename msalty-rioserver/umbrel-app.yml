releaseNotes: >-
  A much smaller download: the app is back to about 70 MB, down from about
  230 MB in 0.2.4. The equaliser now uses a small ffmpeg built with only what
  it needs, and sounds the same. No receiver firmware changes, so no
  power-cycle is needed.


  Since 0.2.3, RioAmp: Settings › Player › RioAmp turns the web interface into a classic
  late-1990s desktop player, and it loads the classic .wsz skins. Its
  ten-band equaliser and balance work on every player: this browser shapes
  its own sound, and for receivers, Chromecasts, browser receivers, iPhones
  and iPads your Umbrel filters the track as it plays, with a moment's
  silence when you let go of a slider. They don't apply to AirPlay and
  Spotify sessions.


  Since 0.2.2, AirPlay and Spotify Connect on more players:
    - Phones and tablets used as receivers get the same AirPlay and Spotify Connect switches as a Rio. Their speaker is there only while the receiver page is open, and is withdrawn a minute after it closes.
    - Chromecasts and Google speakers can be AirPlay speakers (their card has an AirPlay switch). Speaker groups play AirPlay in sync. Expect a few seconds more delay than on a receiver, and a screen such as a Nest Hub or TV keeps showing the song the session started with. They have Spotify Connect built in, so they get no Spotify switch.
    - The player bar and Now Playing show what an AirPlay or Spotify session is playing, with its cover, instead of "Nothing playing".
    - Fixes AirPlay and Spotify sessions on receivers running out of data and stuttering after several minutes. Receivers now keep more of the stream in hand.

  If you're updating from 0.2.2 or earlier, power-cycle your receivers so they
  boot the new firmware.


  Since 0.2.1: receivers as AirPlay and Spotify Connect speakers. Each receiver can show up
  in an iPhone's AirPlay menu and in Spotify's device picker, named after the
  receiver. Both are off until you switch them on with the AirPlay and Spotify
  Connect switches on the receiver's card under Receivers.
    - Spotify Connect needs Spotify Premium. AirPlay is classic AirPlay (AirPlay 1), so Home app multi-room and Siri aren't offered.
    - Expect a delay of a few seconds between the phone and the sound.
    - The newest phone to connect wins. Starting music from the receiver or the web interface, or pressing Stop, ends the phone's session.
    - The phone's volume controls the receiver. The receiver's own queue is saved, and its card offers "Resume Up Next" afterwards.
    - Only receivers running the RioServer NG firmware 1.8 or later take part.


  Since 0.2.0: firmware 1.7, so music started from the web interface wakes a
  receiver from standby. Text on Now Playing and other album-art tinted views
  stays readable whatever the cover's colours.


  Since 0.1.9, web interface improvements, mostly for phones:
    - The player shows which receiver or speaker it's controlling.
    - A phone or tablet used as a receiver remembers its name, so it's set up only once. On an iPhone or iPad, add the web interface to the Home Screen so Safari doesn't forget it.
    - No more accidental zooming, and going back returns you to where you were in the artist and album lists.
    - The player stays on top and usable while the menu is open.


  Since 0.1.8: phones and tablets can be receivers. Open the web interface on
  an old phone or tablet plugged into a stereo, go to Receivers and choose "Use
  this device as a receiver". It then shows up on every other device with Up
  Next, moving playback, the sleep timer, alarms and podcast resume, and plays
  songs without gaps. Keep its page open and on screen: browsers pause pages
  that aren't showing, and over plain HTTP (the way Umbrel serves the app) the
  page can't keep the screen on by itself, so set the device's screen timeout
  to never. Long titles in Now Playing scroll like a ticker and can be swiped,
  jump bars read # A to Z, and albums sort the way they're filed.


  Since 0.1.7, a big feature release:
    - Up Next: see and reorder what's coming up on any receiver or speaker, and use "Play next" or "Add to Up Next" without losing the current queue.
    - Move playback, queue and position from one room's player to another.
    - Make, rename, reorder and delete playlists in the web interface. They show up on the receivers too.
    - Play history: Recently Played and Top 25 Most Played, on the receiver and on the web.
    - Podcasts: subscribe by feed URL or OPML. Episodes download to the app's storage and resume where you left off on any device.
    - Alarm clock: start music on a receiver at a set time and fade it in.
    - Chromecasts go from one track to the next without a gap.
    - Web interface: full-screen Now Playing, song menus (right-click or long-press), a Light / Dark / System theme, colours from the album art, current covers on receiver cards, an A-Z bar for Songs, and album sorting.


  Since 0.1.6: receivers decode MP3s with Rockbox's faster decoder to free up
  CPU on 320 kbps tracks, and scrolling titles redraw only their own line.


  Since 0.1.4: receivers detect audio dropouts and report their audio buffer
  and CPU load in the app's logs. Fixes one cause of audio skips: music files are read without
  holding up every other stream, which helps when your music is on a slow or
  sleeping disk. If a receiver's stream runs dry, the server logs the track and
  its bitrate. On phones and narrow windows, "Play on" is an icon next to the
  search box. Chromecasts, Google Home and Nest speakers, speaker groups and
  TVs with Chromecast built-in show up next to your receivers, and you can send
  music to them from the web interface. A receiver that is booting no longer
  leaves a stray extra card in the web interface.


  Since 0.1.1: fixes a short skip every 5 to 10 minutes during playback, most
  noticeable with 320 kbps MP3s. The web interface can be installed as an app
  on your phone when it is served over HTTPS. The volume slider no longer overflows the receiver cards.
  Receivers now boot with a RioServer NG logo instead of "DELL" (the receiver's
  flash still shows the old logo for a moment at power-on). Volume and other
  controls from the web interface take effect instantly instead of after up to
  3 seconds, and the volume slider no longer jumps around; it is now also shown
  on phones. Artist tiles show the artist's picture or newest album cover
  (put an artist.jpg in an artist's folder to choose one). New: name your
  receivers, a sleep timer per receiver, lock-screen controls when playing in
  the browser, and keyboard shortcuts.
